---
- name: Check that RedELK sync SSH public key exists on control node
  ansible.builtin.stat:
    path: "{{ redelk_sync_public_key_path }}"
  delegate_to: localhost
  become: false
  register: redelk_sync_key

- name: Fail when RedELK sync SSH public key is missing
  ansible.builtin.assert:
    that:
      - redelk_sync_key.stat.exists
    fail_msg: >-
      Missing RedELK sync SSH key at {{ redelk_sync_public_key_path }}.
      Generate public deployment artifacts first or set redelk_sync_public_key_path.

- name: Create RedELK sync user
  become: true
  ansible.builtin.user:
    name: "{{ redelk_sync_user }}"
    shell: "{{ redelk_sync_user_shell }}"
    create_home: true
    password: >-
      {{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') | password_hash('md5_crypt') }}
    update_password: on_create

- name: Ensure SSH directory exists for RedELK sync user
  become: true
  ansible.builtin.file:
    path: "{{ redelk_sync_user_home }}/.ssh"
    state: directory
    owner: "{{ redelk_sync_user }}"
    group: "{{ redelk_sync_user }}"
    mode: "0700"

- name: Check for existing authorized_keys for RedELK sync user
  become: true
  ansible.builtin.stat:
    path: "{{ redelk_sync_user_home }}/.ssh/authorized_keys"
  register: redelk_sync_authorized_keys

- name: Read existing authorized_keys for RedELK sync user
  become: true
  ansible.builtin.slurp:
    src: "{{ redelk_sync_user_home }}/.ssh/authorized_keys"
  register: redelk_sync_authorized_keys_content
  when: redelk_sync_authorized_keys.stat.exists

- name: Back up previous authorized_keys for RedELK sync user
  become: true
  ansible.builtin.copy:
    src: "{{ redelk_sync_user_home }}/.ssh/authorized_keys"
    dest: "{{ redelk_sync_user_home }}/.ssh/authorized_keys_old"
    remote_src: true
    owner: "{{ redelk_sync_user }}"
    group: "{{ redelk_sync_user }}"
    mode: "0600"
  when:
    - redelk_sync_authorized_keys.stat.exists
    - (redelk_sync_authorized_keys_content.content | b64decode) != (lookup('file', redelk_sync_public_key_path) | trim ~ '\n')

- name: Install SSH authorized key for RedELK sync user
  become: true
  ansible.builtin.copy:
    dest: "{{ redelk_sync_user_home }}/.ssh/authorized_keys"
    content: "{{ lookup('file', redelk_sync_public_key_path) | trim }}\n"
    owner: "{{ redelk_sync_user }}"
    group: "{{ redelk_sync_user }}"
    mode: "0600"

- name: Deploy rush configuration
  become: true
  ansible.builtin.template:
    src: etc/rush.rc.j2
    dest: /etc/rush.rc
    owner: root
    group: root
    mode: "0644"

- name: Ensure RedELK log directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure RedELK bin directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure RedELK sync directories exist
  become: true
  ansible.builtin.file:
    path: "{{ redelk_sync_user_home }}/{{ item }}"
    state: directory
    owner: "{{ redelk_sync_user }}"
    group: "{{ redelk_sync_user }}"
    mode: "0755"
  loop:
    - cobaltstrike
    - cobaltstrike/downloads
    - stage1
    - stage1/downloads
    - sliver

- name: Deploy RedELK C2 helper scripts
  become: true
  ansible.builtin.template:
    src: "redelk-bin/{{ item }}.j2"
    dest: "{{ redelk_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0775"
  loop:
    - copydownloads_cobaltstrike.sh
    - copydownloads_outflankstage1.sh
    - export_cobaltstrikedata.sh
    - exportcsdata.py

- name: Deploy RedELK C2 cron jobs
  become: true
  ansible.builtin.template:
    src: "etc/cron.d/{{ item.src }}"
    dest: "/etc/cron.d/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: redelk_sync_cobaltstrike_data.j2
      dest: redelk_sync_cobaltstrike_data
    - src: redelk_sync_stage1_data.j2
      dest: redelk_sync_stage1_data
    - src: redelk_sync_sliver_data.j2
      dest: redelk_sync_sliver_data
