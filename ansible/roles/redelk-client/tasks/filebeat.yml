---
- name: Ensure required connector variables are set
  ansible.builtin.assert:
    that:
      - redelk_attack_scenario is defined
      - redelk_logstash_endpoint is defined
    fail_msg: "Set redelk_attack_scenario and redelk_logstash_endpoint in inventory or group_vars."

- name: Set connector CA source path for c2servers
  ansible.builtin.set_fact:
    redelk_ca_source_path: "{{ redelk_local_repo_path }}/c2servers/filebeat/redelkCA.crt"
  when: "'c2servers' in group_names"

- name: Set connector CA source path for redirs
  ansible.builtin.set_fact:
    redelk_ca_source_path: "{{ redelk_local_repo_path }}/redirs/filebeat/redelkCA.crt"
  when: "'redirs' in group_names"

- name: Ensure supported connector target type
  ansible.builtin.assert:
    that:
      - redelk_ca_source_path is defined
    fail_msg: "redelk-client only supports hosts in 'c2servers' or 'redirs'."

- name: Check that RedELK CA certificate exists on control node
  ansible.builtin.stat:
    path: "{{ redelk_ca_source_path }}"
  delegate_to: localhost
  become: false
  register: redelk_ca_source

- name: Fail when RedELK CA certificate is missing
  ansible.builtin.assert:
    that:
      - redelk_ca_source.stat.exists
    fail_msg: >-
      Missing RedELK CA certificate at {{ redelk_ca_source_path }}.
      Generate public deployment artifacts first or set a valid CA path.

- name: Ensure Filebeat inputs directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_filebeat_inputs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Check for existing Filebeat main configuration
  become: true
  ansible.builtin.stat:
    path: "{{ redelk_filebeat_main_config }}"
  register: redelk_filebeat_main_config_stat

- name: Check for existing legacy-style Filebeat backup
  become: true
  ansible.builtin.stat:
    path: "{{ redelk_filebeat_main_config }}.ori"
  register: redelk_filebeat_main_config_backup_stat

- name: Preserve legacy-style Filebeat backup
  become: true
  ansible.builtin.copy:
    src: "{{ redelk_filebeat_main_config }}"
    dest: "{{ redelk_filebeat_main_config }}.ori"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - redelk_filebeat_main_config_stat.stat.exists
    - not redelk_filebeat_main_config_backup_stat.stat.exists

- name: Deploy Filebeat main configuration
  become: true
  ansible.builtin.template:
    src: etc/filebeat/filebeat.yml.j2
    dest: "{{ redelk_filebeat_main_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart filebeat

- name: Deploy C2 Filebeat input configurations
  become: true
  ansible.builtin.template:
    src: "etc/filebeat/inputs.d/{{ item }}.yml.j2"
    dest: "{{ redelk_filebeat_inputs_dir }}/{{ item }}.yml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ redelk_c2_filebeat_inputs }}"
  when: "'c2servers' in group_names"
  notify: Restart filebeat

- name: Remove redirector input file from C2 hosts
  become: true
  ansible.builtin.file:
    path: "{{ redelk_filebeat_redir_input_file }}"
    state: absent
  when: "'c2servers' in group_names"

- name: Remove unused C2 Filebeat input configurations from C2 hosts
  become: true
  ansible.builtin.file:
    path: "{{ redelk_filebeat_inputs_dir }}/{{ item }}.yml"
    state: absent
  loop:
    - cobaltstrike
    - outflankstage1
    - poshc2
    - sliver
  when:
    - "'c2servers' in group_names"
    - item not in redelk_c2_filebeat_inputs

- name: Deploy redirector Filebeat input configuration
  become: true
  ansible.builtin.template:
    src: etc/filebeat/inputs.d/redirs.yml.j2
    dest: "{{ redelk_filebeat_redir_input_file }}"
    owner: root
    group: root
    mode: "0644"
  when: "'redirs' in group_names"
  notify: Restart filebeat
  tags:
    - never

- name: Remove C2 Filebeat input configurations from redirectors
  become: true
  ansible.builtin.file:
    path: "{{ redelk_filebeat_inputs_dir }}/{{ item }}.yml"
    state: absent
  loop:
    - cobaltstrike
    - outflankstage1
    - poshc2
    - sliver
  when: "'redirs' in group_names"

- name: Remove redirector Filebeat input configuration from redirectors
  become: true
  ansible.builtin.file:
    path: "{{ redelk_filebeat_redir_input_file }}"
    state: absent
  when: "'redirs' in group_names"

- name: Deploy RedELK CA certificate
  become: true
  ansible.builtin.copy:
    src: "{{ redelk_ca_source_path }}"
    dest: "{{ redelk_filebeat_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart filebeat

- name: Ensure Filebeat service is enabled and running
  become: true
  ansible.builtin.systemd:
    name: filebeat
    enabled: true
    state: started

- name: Check whether HAProxy logrotate config exists on redirectors
  become: true
  ansible.builtin.stat:
    path: "{{ redelk_redir_haproxy_logrotate_path }}"
  register: redelk_redir_haproxy_logrotate
  when:
    - "'redirs' in group_names"

- name: Adjust HAProxy logrotate schedule to weekly on redirectors
  become: true
  ansible.builtin.replace:
    path: "{{ redelk_redir_haproxy_logrotate_path }}"
    regexp: '(?m)^(\\s*)daily(\\s*)$'
    replace: '\\1weekly\\2'
  when:
    - "'redirs' in group_names"
    - redelk_redir_haproxy_logrotate.stat.exists
