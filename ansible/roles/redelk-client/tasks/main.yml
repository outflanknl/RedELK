---
# RedELK clients install (C2 and redirectors) tasks
- name: Ensure connector host uses a supported package platform
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "Debian"
      - ansible_facts["pkg_mgr"] == "apt"
    fail_msg: "redelk-client currently supports Debian/APT-based hosts only."

- name: Install dependency packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - python3-debian
      - python3-pip
      - locales
    state: present
    update_cache: true
  tags:
    - packages

- name: Ensure configured connector locales exist
  become: true
  community.general.locale_gen:
    name: "{{ [redelk_locale_lang, redelk_locale_lc_all] | unique | list }}"
    state: present
  when: redelk_manage_locale | bool

- name: Manage connector locale defaults
  become: true
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG={{ redelk_locale_lang }}
      LC_ALL={{ redelk_locale_lc_all }}
    owner: root
    group: root
    mode: "0644"
  when: redelk_manage_locale | bool

- name: Install Elastic repository
  become: true
  tags:
    - packages
  block:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Elastic apt signing key
      ansible.builtin.get_url:
        url: "{{ redelk_elastic_repo_key_url }}"
        dest: "{{ redelk_elastic_repo_key_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Elastic APT repository
      ansible.builtin.deb822_repository:
        name: elastic-7.x
        types:
          - deb
        uris:
          - "{{ redelk_elastic_repo_url }}"
        suites:
          - stable
        components:
          - main
        signed_by: "{{ redelk_elastic_repo_key_path }}"
        state: present

- name: Install Filebeat package
  become: true
  ansible.builtin.apt:
    name:
      - "{{ redelk_filebeat_package }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Install C2-side package requirements
  become: true
  ansible.builtin.apt:
    name:
      - rsync
      - rush
    state: present
    update_cache: true
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Install C2-side Python requirements
  become: true
  ansible.builtin.pip:
    name:
      - javaobj-py3
    break_system_packages: "{{ ansible_facts['distribution_version'] is version('24.04', '>=') }}"
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Setup filebeat-side connector package
  ansible.builtin.import_tasks: filebeat.yml
  tags:
    - filebeat
    - beats

- name: Setup C2-side connector extras
  ansible.builtin.import_tasks: c2.yml
  tags:
    - c2
  when: "'c2servers' in group_names"

- name: Set client deployment path for C2 servers
  ansible.builtin.set_fact:
    redelk_client_path: "{{ redelk_remote_base_path }}/c2servers"
  when: "'c2servers' in group_names"

- name: Set client deployment path for redirectors
  ansible.builtin.set_fact:
    redelk_client_path: "{{ redelk_remote_base_path }}/redirs"
  when: "'redirs' in group_names"
