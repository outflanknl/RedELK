---
# RedELK clients install (C2 and redirectors) tasks
- name: Require Ubuntu 24.04 or newer
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] is version('24.04', '>=')
      - ansible_facts["pkg_mgr"] == "apt"
    fail_msg: "RedELK deployment roles require Ubuntu 24.04 or newer."
  tags:
    - always

- name: Validate paths embedded in C2 cron and helper commands
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^/')
      - item is not search('[\x00-\x1f\x7f%]')
    fail_msg: "C2 paths must be absolute and contain no control characters or cron-special percent signs."
  loop:
    - "{{ redelk_cobaltstrike_dir }}"
    - "{{ redelk_stage1_dir }}"
    - "{{ redelk_bin_dir }}"
    - "{{ redelk_log_dir }}"
  when: "'c2servers' in group_names"
  tags:
    - always

- name: Install dependency packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - python3-debian
      - python3-pip
      - locales
    state: present
    update_cache: true
  tags:
    - packages

- name: Ensure configured connector locales exist
  become: true
  community.general.locale_gen:
    name: "{{ [redelk_locale_lang, redelk_locale_lc_all] | unique | list }}"
    state: present

- name: Manage connector locale defaults
  become: true
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG={{ redelk_locale_lang }}
      LC_ALL={{ redelk_locale_lc_all }}
    owner: root
    group: root
    mode: "0644"
- name: Install Elastic repository
  become: true
  tags:
    - packages
  block:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Elastic apt signing key
      ansible.builtin.get_url:
        url: "{{ redelk_elastic_repo_key_url }}"
        dest: "{{ redelk_elastic_repo_key_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Elastic APT repository
      ansible.builtin.deb822_repository:
        name: elastic-7.x
        types:
          - deb
        uris:
          - "{{ redelk_elastic_repo_url }}"
        suites:
          - stable
        components:
          - main
        signed_by: "{{ redelk_elastic_repo_key_path }}"
        state: present

- name: Install Filebeat package
  become: true
  ansible.builtin.apt:
    name:
      - "{{ redelk_filebeat_package }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Install C2-side package requirements
  become: true
  ansible.builtin.apt:
    name:
      - rsync
      - rush
    state: present
    update_cache: true
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Install C2-side Python requirements
  become: true
  ansible.builtin.pip:
    name:
      - javaobj-py3
    break_system_packages: true
  when: "'c2servers' in group_names"
  tags:
    - packages

- name: Setup filebeat-side connector package
  ansible.builtin.import_tasks: filebeat.yml
  tags:
    - filebeat
    - beats

- name: Setup C2-side connector extras
  ansible.builtin.import_tasks: c2.yml
  tags:
    - c2
  when: "'c2servers' in group_names"
