---
- name: Create PKI directory
  delegate_to: localhost
  ansible.builtin.file:
    path: certs
    mode: "0755"
    state: directory

- name: Create CA and leaf certificates
  delegate_to: localhost
  block:
    - name: Generate private key for CA
      community.crypto.openssl_privatekey:
        path: certs/redelkCA.key
        type: RSA
        size: 4096
        mode: "0600"
        format: pkcs8
        format_mismatch: convert
        regenerate: fail

    - name: Derive CA subject key identifier
      community.crypto.openssl_csr_pipe:
        privatekey_path: certs/redelkCA.key
        create_subject_key_identifier: true
      register: redelk_server_ca_key_identifier
      changed_when: false

    - name: Create certificate signing request for CA
      community.crypto.openssl_csr_pipe:
        privatekey_path: certs/redelkCA.key
        subject_ordered: "{{ redelk_certificate_subject }}"
        use_common_name_for_san: false
        digest: sha256
        create_subject_key_identifier: true
        # The selfsigned provider cannot reproduce issuer:always; retain keyid:always.
        authority_key_identifier: >-
          {{ (redelk_server_ca_key_identifier.csr | community.crypto.openssl_csr_info).subject_key_identifier }}
        basic_constraints:
          - CA:TRUE
        basic_constraints_critical: false
      register: redelk_server_ca_csr
      changed_when: false

    - name: Create CA certificate
      community.crypto.x509_certificate:
        path: certs/redelkCA.crt
        privatekey_path: certs/redelkCA.key
        csr_content: "{{ redelk_server_ca_csr.csr }}"
        provider: selfsigned
        selfsigned_digest: sha256
        selfsigned_not_after: +3650d
        mode: "0644"

    - name: Generate private key for RedELK server
      community.crypto.openssl_privatekey:
        path: certs/elkserver.key
        type: RSA
        size: 2048
        mode: "0600"
        format: pkcs8
        format_mismatch: convert
        regenerate: fail

    - name: Create certificate signing request for RedELK server
      community.crypto.openssl_csr:
        path: certs/elkserver.csr
        privatekey_path: certs/elkserver.key
        subject_ordered: "{{ redelk_certificate_subject }}"
        use_common_name_for_san: false
        digest: sha512
        key_usage:
          - nonRepudiation
          - digitalSignature
          - keyEncipherment
          - dataEncipherment
        key_usage_critical: false
        extended_key_usage:
          - serverAuth
        extended_key_usage_critical: false
        subject_alt_name:
          - "DNS:{{ redelk_certificate_san_1 }}"
          - "DNS:{{ redelk_certificate_san_2 }}"
          - "IP:{{ redelk_certificate_ip_1 }}"
        mode: "0644"

    - name: Sign request using CA and create certificate for RedELK server
      community.crypto.x509_certificate:
        path: certs/elkserver.crt
        csr_path: certs/elkserver.csr
        provider: ownca
        ownca_path: certs/redelkCA.crt
        ownca_privatekey_path: certs/redelkCA.key
        ownca_digest: sha512
        ownca_not_after: +3650d
        mode: "0644"


- name: Create SSH keys folder # noqa: risky-file-permissions
  ansible.builtin.file:
    path: sshkey
    state: directory

- name: Generate SSH keypair for scponly user
  community.crypto.openssh_keypair:
    path: sshkey/id_ed25519
    regenerate: fail
    type: ed25519


- name: Ensure deployment directory exists
  ansible.builtin.file:
    path: "{{ redelk_install_folder }}"
    state: directory
    mode: "0755"


# TODO: Deleted BloodHound config fetching, add back later?

- name: Generate or retrieve secrets for RedELK's various components
  ansible.builtin.set_fact:
    redelk_kibana_system_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/kibana_system_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_logstash_system_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/logstash_system_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_ingest_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/redelk_ingest_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/redelk_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_elastic_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/elastic_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_kibana_encryption_key: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/kibana_encryption_key',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_neo4j_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/neo4j_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_postgres_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/postgres_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_bloodhound_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/bloodhound_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
  no_log: true

- name: Copy RedELK files
  ansible.builtin.copy:
    dest: "{{ redelk_install_folder }}"
    src: redelk
    mode: "0755"

- name: Place .env file for Docker Compose stack # noqa: risky-file-permissions
  ansible.builtin.template:
    src: docker-env.j2
    dest: "{{ redelk_install_folder }}/.env"

- name: Place Docker Compose file # noqa: risky-file-permissions
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ redelk_install_folder }}/compose.yml"

- name: Set RedELK mount folder permissions
  ansible.builtin.file:
    path: "{{ redelk_install_folder }}/mounts/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: bloodhound-config, mode: "0755" }
    - { path: elasticsearch-config, owner: "1000", mode: "0755" }
    - { path: jupyter-workbooks, owner: "1000", mode: "0755" }
    - { path: logstash-config, owner: "1000", mode: "0755" }
    - { path: nginx-config, mode: "0755" }
    - { path: redelk-config, mode: "0755" }
    - { path: redelk-logs, owner: "1000", mode: "0755" }
    - { path: redelk-ssh, mode: "0755" }
    - { path: redelk-www, owner: "1000", mode: "0755" }
    - { path: sample-data, mode: "0755" }

- name: Copy SSH keypair for scponly user
  ansible.builtin.copy:
    src: "certs/{{ item.path }}"
    dest: "{{ redelk_install_folder }}/mounts/redelk-ssh"
    mode: "{{ item.mode }}"
  loop:
    - { path: "id_ed25519", mode: "0600" }
    - { path: "id_ed25519.pub", mode: "0644" }

- name: Install RedELK base crontab
  ansible.builtin.copy:
    src: crontab
    dest: "{{ redelk_install_folder }}/mounts/redelk-config/etc/cron.d/redelk"
    mode: "0644"

# FIXME: Much easier to set this as an env var through the Docker compose file
- name: Set Elasticsearch JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ redelk_install_folder }}/mounts/elasticsearch-config/jvm.options.d/jvm.options"
    mode: "0644"

- name: Render RedELK config file
  become: true
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ redelk_server_path }}/mounts/redelk-config/etc/redelk/config.json"
    mode: "0644"
    validate: /usr/bin/python3 -m json.tool %s /dev/null

# FIXME: Templates are static until we expose variables to fill them
- name: Copy RedELK configuration example files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ redelk_server_path }}/mounts/redelk-config/etc/redelk/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "domainslist_redteam.conf.example", dest: "domainslist_redteam.conf" }
    - { src: "iplist_alarmed.conf.example", dest: "iplist_alarmed.conf" }
    - { src: "iplist_blueteam.conf.example", dest: "iplist_blueteam.conf" }
    - { src: "iplist_customer.conf.example", dest: "iplist_customer.conf" }
    - { src: "iplist_redteam.conf.example", dest: "iplist_redteam.conf" }
    - { src: "iplist_unknown.conf.example", dest: "iplist_unknown.conf" }
    - { src: "rogue_useragents.conf.example", dest: "rogue_useragents.conf" }
    - { src: "roguedomains.conf.example", dest: "roguedomains.conf" }

- name: Render RedELK password reference file
  become: true
  ansible.builtin.template:
    src: redelk_passwords.cfg.j2
    dest: "{{ redelk_server_path }}/redelk_passwords.cfg"
    mode: "0600"

- name: Configure Basic Authentication for RedELK web interface through nginx
  community.general.htpasswd:
    name: "{{ redelk_username }}"
    path: "{{ redelk_install_folder }}/mounts/nginx-config/htpasswd.users.template"
    password: "{{ redelk_password }}"
    state: present
    create: true
    hash_scheme: apr_md5_crypt
    mode: "0640"

# FIXME: Make this part of the redelk crontab template we already defined
- name: Configure C2 log sync jobs
  become: true
  ansible.builtin.blockinfile:
    path: "{{ redelk_server_path }}/mounts/redelk-config/etc/cron.d/redelk"
    marker: "# {mark} ANSIBLE MANAGED C2 LOG SYNC"
    insertafter: '^#\*/2 .*getremotelogs'
    block: |
      {% for host in groups.get('c2servers', []) %}
      {% if hostvars[host].deploy_redelk | default(true) | bool %}
      {% set sync_host = hostvars[host].ansible_host | default(host) %}
      {% set sync_id = hostvars[host].redelk_identifier | default(host) %}
      {% set sync_user = hostvars[host].redelk_sync_user | default(redelk_sync_user) %}
      {% set sync_port = hostvars[host].ansible_port | default(22) %}
      */2 * * * * redelk /usr/share/redelk/bin/getremotelogs.sh {{ sync_host }} {{ sync_id }} {{ sync_user }} {{ sync_port }}
      {% endif %}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  when: redelk_server_base_cron.stat.exists

- name: Configure vm.max_map_count for Elasticsearch
  become: true
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-redelk.conf
    state: present
    reload: true

- name: Render RedELK server configuration
  ansible.builtin.template:
    src: redelk-config.j2
    dest: "{{ redelk_install_folder }}/mounts/redelk-config/config.json"
    mode: "0644"

- name: Start RedELK server
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_install_folder }}"
    project_name: redelk
    build: always
    state: present
