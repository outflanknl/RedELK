---
- name: Create PKI directory
  delegate_to: localhost
  ansible.builtin.file:
    path: certs
    mode: "0755"
    state: directory

- name: Create CA and leaf certificates
  delegate_to: localhost
  block:
    - name: Generate private key for CA
      community.crypto.openssl_privatekey:
        path: certs/redelkCA.key
        type: RSA
        size: 4096
        mode: "0600"
        format: pkcs8
        format_mismatch: convert
        regenerate: fail

    - name: Derive CA subject key identifier
      community.crypto.openssl_csr_pipe:
        privatekey_path: certs/redelkCA.key
        create_subject_key_identifier: true
      register: redelk_server_ca_key_identifier
      changed_when: false

    - name: Create certificate signing request for CA
      community.crypto.openssl_csr_pipe:
        privatekey_path: certs/redelkCA.key
        subject_ordered: "{{ redelk_certificate_subject }}"
        use_common_name_for_san: false
        digest: sha256
        create_subject_key_identifier: true
        # The selfsigned provider cannot reproduce issuer:always; retain keyid:always.
        authority_key_identifier: >-
          {{ (redelk_server_ca_key_identifier.csr | community.crypto.openssl_csr_info).subject_key_identifier }}
        basic_constraints:
          - CA:TRUE
        basic_constraints_critical: false
      register: redelk_server_ca_csr
      changed_when: false

    - name: Create CA certificate
      community.crypto.x509_certificate:
        path: certs/redelkCA.crt
        privatekey_path: certs/redelkCA.key
        csr_content: "{{ redelk_server_ca_csr.csr }}"
        provider: selfsigned
        selfsigned_digest: sha256
        selfsigned_not_after: +3650d
        mode: "0644"

    - name: Generate private key for RedELK server
      community.crypto.openssl_privatekey:
        path: certs/elkserver.key
        type: RSA
        size: 2048
        mode: "0600"
        format: pkcs8
        format_mismatch: convert
        regenerate: fail

    - name: Create certificate signing request for RedELK server
      community.crypto.openssl_csr:
        path: certs/elkserver.csr
        privatekey_path: certs/elkserver.key
        subject_ordered: "{{ redelk_certificate_subject }}"
        use_common_name_for_san: false
        digest: sha512
        key_usage:
          - nonRepudiation
          - digitalSignature
          - keyEncipherment
          - dataEncipherment
        key_usage_critical: false
        extended_key_usage:
          - serverAuth
        extended_key_usage_critical: false
        subject_alt_name:
          - "DNS:{{ redelk_certificate_san_1 }}"
          - "DNS:{{ redelk_certificate_san_2 }}"
          - "IP:{{ redelk_certificate_ip_1 }}"
        mode: "0644"

    - name: Sign request using CA and create certificate for RedELK server
      community.crypto.x509_certificate:
        path: certs/elkserver.crt
        csr_path: certs/elkserver.csr
        provider: ownca
        ownca_path: certs/redelkCA.crt
        ownca_privatekey_path: certs/redelkCA.key
        ownca_digest: sha512
        ownca_not_after: +3650d
        mode: "0644"


- name: Create SSH keys folder # noqa: risky-file-permissions
  ansible.builtin.file:
    path: sshkey
    state: directory

- name: Generate SSH keypair for scponly user
  community.crypto.openssh_keypair:
    path: sshkey/id_ed25519
    regenerate: fail
    type: ed25519


- name: Ensure deployment directory exists
  ansible.builtin.file:
    path: /opt/redelk
    state: directory
    mode: "0755"


# TODO: Deleted BloodHound config fetching, add back later?

- name: Generate or retrieve secrets for RedELK's various components
  ansible.builtin.set_fact:
    redelk_kibana_system_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/kibana_system_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_logstash_system_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/logstash_system_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_redelk_ingest_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/redelk_ingest_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_redelk_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/redelk_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_elastic_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/elastic_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_kibana_encryption_key: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/kibana_encryption_key',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_neo4j_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/neo4j_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_postgres_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/postgres_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
    redelk_bloodhound_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          playbook_dir + '/secrets/bloodhound_password',
          length=32,
          chars=['ascii_letters', 'digits', '_']
        )
      }}
  no_log: true

- name: Copy RedELK files
  ansible.builtin.copy:
    dest: /opt/redelk
    src: redelk
    mode: "0755"

- name: Place .env file for Docker Compose stack # noqa: risky-file-permissions
  ansible.builtin.template:
    src: docker-env.j2
    dest: /opt/redelk/.env

# TODO: Allow customizing install folder
- name: Place Docker Compose file # noqa: risky-file-permissions
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/redelk/compose.yml

- name: Set SSH folder permissions
  ansible.builtin.file:
    dest: /opt/redelk/mounts/redelk-ssh
    mode: "0700"

- name: Copy SSH keypair for scponly user
  ansible.builtin.copy:
    src: "certs/{{ item.path }}"
    dest: /opt/redelk/mounts/redelk-ssh
    mode: "{{ item.mode }}"
  loop:
    - { path: "id_ed25519", mode: "0600" }
    - { path: "id_ed25519.pub", mode: "0644" }

- name: Install RedELK base crontab
  ansible.builtin.copy:
    src: crontab
    dest: /opt/redelk/mounts/redelk-config/etc/cron.d/redelk
    mode: "0644"

- name: Configure C2 log sync jobs
  become: true
  ansible.builtin.blockinfile:
    path: "{{ redelk_server_path }}/mounts/redelk-config/etc/cron.d/redelk"
    marker: "# {mark} ANSIBLE MANAGED C2 LOG SYNC"
    insertafter: '^#\*/2 .*getremotelogs'
    block: |
      {% for host in groups.get('c2servers', []) %}
      {% if hostvars[host].deploy_redelk | default(true) | bool %}
      {% set sync_host = hostvars[host].ansible_host | default(host) %}
      {% set sync_id = hostvars[host].redelk_identifier | default(host) %}
      {% set sync_user = hostvars[host].redelk_sync_user | default(redelk_sync_user) %}
      {% set sync_port = hostvars[host].ansible_port | default(22) %}
      */2 * * * * redelk /usr/share/redelk/bin/getremotelogs.sh {{ sync_host }} {{ sync_id }} {{ sync_user }} {{ sync_port }}
      {% endif %}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  when: redelk_server_base_cron.stat.exists

- name: Check for packaged initial setup certificate config
  ansible.builtin.stat:
    path: "{{ redelk_server_path }}/initial-setup-data/certs/config.cnf"
  register: redelk_server_initial_setup_cert_config
  when: not redelk_letsencrypt_enabled | bool

- name: Read packaged initial setup certificate config
  ansible.builtin.slurp:
    src: "{{ redelk_server_path }}/initial-setup-data/certs/config.cnf"
  register: redelk_server_initial_setup_cert_config_content
  when:
    - not redelk_letsencrypt_enabled | bool
    - redelk_server_initial_setup_cert_config.stat.exists

- name: Resolve self-signed certificate subject from packaged config
  ansible.builtin.set_fact:
    redelk_server_self_signed_cert_subject: >-
      {{
        (
          (
            redelk_server_initial_setup_cert_config_content.content | b64decode
            if redelk_server_initial_setup_cert_config.stat.exists
            else ''
          )
          | regex_findall('(?m)^(?:DNS|IP)\.\d+\s*=\s*(.+)$')
          | map('trim')
          | first
        )
        | default(redelk_external_domain | default(redelk_self_signed_cert_dirname, true), true)
      }}
  when: not redelk_letsencrypt_enabled | bool

- name: Render Docker environment file
  become: true
  ansible.builtin.template:
    src: docker-env.j2
    dest: "{{ redelk_server_path }}/.env"
    mode: "0640"

- name: Render RedELK config file
  become: true
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ redelk_server_path }}/mounts/redelk-config/etc/redelk/config.json"
    mode: "0644"

- name: Render BloodHound config
  become: true
  ansible.builtin.template:
    src: bloodhound.config.json.j2
    dest: "{{ redelk_server_path }}/mounts/bloodhound-config/bloodhound.config.json"
    mode: "0644"
  when: redelk_server_bloodhound_enabled | bool

- name: Render RedELK password reference file
  become: true
  ansible.builtin.template:
    src: redelk_passwords.cfg.j2
    dest: "{{ redelk_server_path }}/redelk_passwords.cfg"
    mode: "0600"

- name: Render password reference file for Jupyter notebooks
  become: true
  ansible.builtin.template:
    src: redelk_passwords.cfg.j2
    dest: "{{ redelk_server_path }}/mounts/jupyter-workbooks/redelk_passwords.py"
    mode: "0600"

- name: Create htpasswd file for RedELK web access
  become: true
  community.general.htpasswd:
    path: "{{ redelk_server_path }}/mounts/nginx-config/htpasswd.users.template"
    name: "{{ redelk_redelk_username }}"
    password: "{{ redelk_server_redelk_password }}"
    create: true
    mode: "0640"

- name: Set Elasticsearch JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: /opt/redelk/mounts/elasticsearch-config/jvm.options.d/jvm.options
    mode: "0644"

- name: Ensure recursive ownership on Logstash config
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/logstash-config"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Ensure recursive ownership on RedELK logs
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/redelk-logs"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Ensure recursive ownership on RedELK www data
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/redelk-www"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Ensure recursive ownership on Jupyter workbooks
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/jupyter-workbooks"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Ensure recursive ownership on Elasticsearch config
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/elasticsearch-config"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Find RedELK log files for mode normalization
  become: true
  ansible.builtin.find:
    paths: "{{ redelk_server_path }}/mounts/redelk-logs"
    file_type: file
  register: redelk_server_log_files

- name: Set permissions on RedELK log files
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0664"
  loop: "{{ redelk_server_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find RedELK www files for mode normalization
  become: true
  ansible.builtin.find:
    paths: "{{ redelk_server_path }}/mounts/redelk-www"
    file_type: any
    recurse: false
  register: redelk_server_www_entries

- name: Set permissions on RedELK www top-level entries
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0755"
  loop: "{{ redelk_server_www_entries.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Disable full-only nginx locations for limited install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*include conf\.d/full\.location-conf;\s*$'
    line: '    # include conf.d/full.location-conf;'
  when: not (redelk_server_bloodhound_enabled | bool)

- name: Disable full-only nginx BloodHound location for limited install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*include conf\.d/full\.bloodhound-conf;\s*$'
    line: '# include conf.d/full.bloodhound-conf;'
  when: not (redelk_server_bloodhound_enabled | bool)

- name: Enable full nginx locations for full-style install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*#\s*include conf\.d/full\.location-conf;\s*$'
    line: '    include conf.d/full.location-conf;'
  when: redelk_server_bloodhound_enabled | bool

- name: Enable full nginx BloodHound location for full-style install
  become: true
  ansible.builtin.lineinfile:
    path: "{{ redelk_server_path }}/mounts/nginx-config/default.conf.template"
    regexp: '^\s*#\s*include conf\.d/full\.bloodhound-conf;\s*$'
    line: 'include conf.d/full.bloodhound-conf;'
  when: redelk_server_bloodhound_enabled | bool

- name: Link docker-compose.yml to selected RedELK stack file
  become: true
  ansible.builtin.file:
    src: "{{ redelk_server_compose_file }}"
    dest: "{{ redelk_server_path }}/docker-compose.yml"
    state: link
    force: true

- name: Persist vm.max_map_count for Elasticsearch
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-redelk.conf
    content: "vm.max_map_count={{ redelk_vm_max_map_count }}\n"
    owner: root
    group: root
    mode: "0644"
  register: redelk_vm_max_map_count_config
  when: not redelk_dryrun | bool

- name: Apply sysctl settings when vm.max_map_count config changed
  become: true
  ansible.builtin.command: sysctl --system
  when:
    - not redelk_dryrun | bool
    - redelk_vm_max_map_count_config.changed
  changed_when: true

- name: Check for existing self-signed certificate
  ansible.builtin.stat:
    path: >-
      {{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/fullchain.pem
  register: redelk_server_self_signed_cert
  when: not redelk_letsencrypt_enabled | bool

- name: Ensure self-signed certificate directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: not redelk_letsencrypt_enabled | bool

- name: Create self-signed certificate for nginx
  become: true
  community.crypto.openssl_privatekey:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/privkey.pem"
    type: RSA
    size: 4096
    mode: "0600"
  when: not redelk_letsencrypt_enabled | bool

- name: Build self-signed certificate request content for nginx
  become: true
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/privkey.pem"
    common_name: "{{ redelk_server_self_signed_cert_subject }}"
    use_common_name_for_san: false
  register: redelk_server_self_signed_cert_csr
  when:
    - not redelk_letsencrypt_enabled | bool
    - not redelk_server_self_signed_cert.stat.exists

- name: Create self-signed certificate for nginx
  become: true
  community.crypto.x509_certificate:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/fullchain.pem"
    privatekey_path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}/privkey.pem"
    csr_content: "{{ redelk_server_self_signed_cert_csr.csr }}"
    provider: selfsigned
    selfsigned_create_subject_key_identifier: always_create
    selfsigned_digest: sha256
    selfsigned_not_after: +365d
    mode: "0644"
  when:
    - not redelk_letsencrypt_enabled | bool
    - not redelk_server_self_signed_cert.stat.exists

- name: Ensure self-signed certificate ownership matches legacy installer
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_self_signed_cert_dirname }}"
    owner: "1000"
    group: "1000"
    recurse: true
  when: not redelk_letsencrypt_enabled | bool

- name: Check for existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}/fullchain.pem"
  register: redelk_server_letsencrypt_cert
  when: redelk_letsencrypt_enabled | bool

- name: Build Let's Encrypt email arguments
  ansible.builtin.set_fact:
    redelk_server_letsencrypt_email_argv: >-
      {{
        ['--register-unsafely-without-email']
        if redelk_letsencrypt_email | trim | length == 0
        else ['--email', redelk_letsencrypt_email]
      }}
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Build Let's Encrypt staging arguments
  ansible.builtin.set_fact:
    redelk_server_letsencrypt_staging_argv: >-
      {{ ['--staging'] if redelk_letsencrypt_staging | string != '0' else [] }}
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Build Let's Encrypt certbot command arguments
  ansible.builtin.set_fact:
    redelk_server_letsencrypt_certbot_argv: >-
      {{
        ['certonly', '--webroot', '-w', '/var/www/certbot']
        + redelk_server_letsencrypt_staging_argv
        + redelk_server_letsencrypt_email_argv
        + ['-d', redelk_external_domain, '--rsa-key-size', '4096', '--agree-tos', '--force-renewal', '-n']
      }}
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Ensure Let's Encrypt live directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Create dummy private key for Let's Encrypt bootstrap
  become: true
  community.crypto.openssl_privatekey:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}/privkey.pem"
    type: RSA
    size: 4096
    mode: "0600"
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Create dummy certificate for Let's Encrypt bootstrap
  become: true
  community.crypto.x509_certificate:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}/fullchain.pem"
    privatekey_path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}/privkey.pem"
    provider: selfsigned
    selfsigned_digest: sha256
    selfsigned_not_after: +365d
    mode: "0644"
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Start nginx for Let's Encrypt webroot validation
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_server_path }}"
    project_name: "{{ redelk_compose_project_name }}"
    files:
      - docker-compose.yml
    services:
      - nginx
    dependencies: false
    state: present
    wait: true
    wait_timeout: 120
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Remove dummy Let's Encrypt certificate directory
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}"
    state: absent
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_dryrun | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Request Let's Encrypt certificate with certbot
  become: true
  community.docker.docker_compose_v2_run:
    project_src: "{{ redelk_server_path }}"
    project_name: "{{ redelk_compose_project_name }}"
    files:
      - docker-compose.yml
    service: certbot
    argv: "{{ redelk_server_letsencrypt_certbot_argv }}"
    cleanup: true
    no_deps: true
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Restart nginx after Let's Encrypt bootstrap
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_server_path }}"
    project_name: "{{ redelk_compose_project_name }}"
    files:
      - docker-compose.yml
    services:
      - nginx
    dependencies: false
    state: restarted
  when:
    - redelk_letsencrypt_enabled | bool
    - not redelk_server_letsencrypt_cert.stat.exists

- name: Ensure Let's Encrypt certificate ownership matches legacy installer
  become: true
  ansible.builtin.file:
    path: "{{ redelk_server_path }}/mounts/certbot/conf/live/{{ redelk_external_domain }}"
    owner: "1000"
    group: "1000"
    recurse: true
  when: redelk_letsencrypt_enabled | bool

- name: Start or update RedELK stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_server_path }}"
    project_name: "{{ redelk_compose_project_name }}"
    files:
      - docker-compose.yml
    build: always
    state: present
  when:
    - redelk_start_containers | bool
    - not redelk_dryrun | bool
