---
# RedELK server installation tasks

- name: Require Ubuntu 24.04 or newer
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] is version('24.04', '>=')
      - ansible_facts["pkg_mgr"] == "apt"
    fail_msg: "RedELK deployment roles require Ubuntu 24.04 or newer."
  tags:
    - always

- name: Validate the pinned controller release before deployment
  ansible.builtin.import_tasks: release.yml
  tags:
    - always

- name: Install required packages
  ansible.builtin.import_tasks: packages.yml
  tags:
    - packages

- name: Setup RedELK server
  ansible.builtin.import_tasks: redelk-setup.yml
  tags:
    - redelk-setup
