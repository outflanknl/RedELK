---
- name: Determine whether RedELK server role requires Docker runtime
  ansible.builtin.set_fact:
    redelk_server_requires_docker_runtime: >-
      {{ redelk_start_containers | bool }}

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  when: redelk_server_requires_docker_runtime | bool

- name: Gather service facts
  ansible.builtin.service_facts:
  when: redelk_server_requires_docker_runtime | bool

- name: Assert Docker packages are available for the RedELK server role
  ansible.builtin.assert:
    that:
      - "'docker-ce' in ansible_facts.packages or 'docker.io' in ansible_facts.packages"
      - "'docker-compose-plugin' in ansible_facts.packages or 'docker-compose' in ansible_facts.packages"
    fail_msg: >-
      Docker engine and Compose plugin/packages must be installed before running
      redelk-server when container management is enabled.
  when: redelk_server_requires_docker_runtime | bool

- name: Assert Docker service is available and running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - ansible_facts.services['docker.service'].state == 'running'
    fail_msg: >-
      Docker service must be installed and running before running redelk-server
      when container management is enabled.
  when: redelk_server_requires_docker_runtime | bool
