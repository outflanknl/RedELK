---
- name: Restart Caddy
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_install_folder }}"
    services:
      - caddy
    dependencies: false
    state: restarted

- name: Restart RedELK docker containers
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ redelk_install_folder }}"
    build: always
    state: restarted
