---
- name: Prepare RedELK deployment packages on control node
  run_once: true
  delegate_to: localhost
  block:
    - name: Check OpenSSL config path exists
      ansible.builtin.stat:
        path: "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      register: redelk_package_openssl_config

    - name: Fail when OpenSSL config is missing
      ansible.builtin.fail:
        msg: >-
          Missing OpenSSL config {{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}.
      when: not redelk_package_openssl_config.stat.exists

    - name: Read OpenSSL config
      ansible.builtin.slurp:
        src: "{{ redelk_local_repo_path }}/{{ redelk_openssl_config_path }}"
      register: redelk_package_openssl_config_content

    - name: Fail when OpenSSL config still contains placeholder values
      ansible.builtin.assert:
        that:
          - redelk_package_openssl_config_content.content | b64decode is not search('MODIFYME')
          - redelk_package_openssl_config_content.content | b64decode is not search('dnsnameofyourredelkserver')
          - redelk_package_openssl_config_content.content | b64decode is not search('someseconddnsname')
          - redelk_package_openssl_config_content.content | b64decode is not search('123\\.123\\.123\\.123')
        fail_msg: >-
          OpenSSL config {{ redelk_openssl_config_path }} still contains example placeholder values.

    - name: Parse OpenSSL config values for RedELK certificates
      ansible.builtin.set_fact:
        redelk_package_openssl_config_text: "{{ redelk_package_openssl_config_content.content | b64decode }}"
        redelk_package_cert_country_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^C\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_state_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^ST\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_locality_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^L\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_organization_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^O\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_organizational_unit_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^OU\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_common_name: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^CN\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_email_address: >-
          {{ (redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^emailAddress\s*=\s*(.+)$') | first) | trim }}
        redelk_package_cert_dns_sans: >-
          {{ redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^DNS\.\d+\s*=\s*(.+)$') | map('trim') | list }}
        redelk_package_cert_ip_sans: >-
          {{ redelk_package_openssl_config_content.content | b64decode | regex_findall('(?m)^IP\.\d+\s*=\s*(.+)$') | map('trim') | list }}

    - name: Build RedELK server subject alternative names
      ansible.builtin.set_fact:
        redelk_package_cert_subject_alt_name: >-
          {{
            (redelk_package_cert_dns_sans | map('regex_replace', '^', 'DNS:') | list)
            +
            (redelk_package_cert_ip_sans | map('regex_replace', '^', 'IP:') | list)
          }}

    - name: Find example files in repository
      ansible.builtin.find:
        paths: "{{ redelk_local_repo_path }}"
        recurse: true
        patterns: '*.example'
        file_type: file
      register: redelk_package_example_files

    - name: Check whether target files already exist
      ansible.builtin.stat:
        path: "{{ item.path | regex_replace('\\.example$', '') }}"
      loop: "{{ redelk_package_example_files.files }}"
      register: redelk_package_example_targets

    - name: Copy example files into missing runtime files
      ansible.builtin.copy:
        src: "{{ item.item.path }}"
        dest: "{{ item.item.path | regex_replace('\\.example$', '') }}"
        remote_src: true
        mode: preserve
        force: false
      loop: "{{ redelk_package_example_targets.results }}"
      when: not item.stat.exists

    - name: Ensure certificate directory exists
      ansible.builtin.file:
        path: "{{ redelk_local_repo_path }}/certs"
        state: directory
        mode: '0755'

    - name: Generate RedELK CA private key
      community.crypto.openssl_privatekey:
        path: "{{ redelk_local_repo_path }}/certs/redelkCA.key"
        type: RSA
        size: 2048
        format: pkcs1
        mode: "0600"

    - name: Build RedELK CA certificate signing request content
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ redelk_local_repo_path }}/certs/redelkCA.key"
        digest: sha256
        country_name: "{{ redelk_package_cert_country_name }}"
        state_or_province_name: "{{ redelk_package_cert_state_name }}"
        locality_name: "{{ redelk_package_cert_locality_name }}"
        organization_name: "{{ redelk_package_cert_organization_name }}"
        organizational_unit_name: "{{ redelk_package_cert_organizational_unit_name }}"
        common_name: "{{ redelk_package_cert_common_name }}"
        email_address: "{{ redelk_package_cert_email_address }}"
        basic_constraints:
          - CA:TRUE
        create_subject_key_identifier: true
        use_common_name_for_san: false
      register: redelk_package_ca_csr

    - name: Generate RedELK CA certificate
      community.crypto.x509_certificate:
        path: "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
        privatekey_path: "{{ redelk_local_repo_path }}/certs/redelkCA.key"
        csr_content: "{{ redelk_package_ca_csr.csr }}"
        provider: selfsigned
        selfsigned_digest: sha256
        selfsigned_not_after: +3650d
        mode: "0644"

    - name: Generate ELK server private key
      community.crypto.openssl_privatekey:
        path: "{{ redelk_local_repo_path }}/certs/elkserver.key"
        type: RSA
        size: 2048
        format: pkcs1
        mode: "0600"

    - name: Generate ELK server certificate signing request
      community.crypto.openssl_csr:
        path: "{{ redelk_local_repo_path }}/certs/elkserver.csr"
        privatekey_path: "{{ redelk_local_repo_path }}/certs/elkserver.key"
        digest: sha512
        country_name: "{{ redelk_package_cert_country_name }}"
        state_or_province_name: "{{ redelk_package_cert_state_name }}"
        locality_name: "{{ redelk_package_cert_locality_name }}"
        organization_name: "{{ redelk_package_cert_organization_name }}"
        organizational_unit_name: "{{ redelk_package_cert_organizational_unit_name }}"
        common_name: "{{ redelk_package_cert_common_name }}"
        email_address: "{{ redelk_package_cert_email_address }}"
        key_usage:
          - nonRepudiation
          - digitalSignature
          - keyEncipherment
          - dataEncipherment
        extended_key_usage:
          - serverAuth
        subject_alt_name: "{{ redelk_package_cert_subject_alt_name }}"
        use_common_name_for_san: false
        mode: "0644"

    - name: Sign ELK server certificate with RedELK CA
      community.crypto.x509_certificate:
        path: "{{ redelk_local_repo_path }}/certs/elkserver.crt"
        csr_path: "{{ redelk_local_repo_path }}/certs/elkserver.csr"
        ownca_path: "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
        ownca_privatekey_path: "{{ redelk_local_repo_path }}/certs/redelkCA.key"
        ownca_digest: sha512
        ownca_not_after: +3650d
        provider: ownca
        mode: "0644"

    - name: Check whether ELK private key PKCS1 backup exists
      ansible.builtin.stat:
        path: "{{ redelk_local_repo_path }}/certs/elkserver.key.pem"
      register: redelk_elkserver_key_backup

    - name: Preserve PKCS1 backup of ELK private key before conversion
      ansible.builtin.copy:
        src: "{{ redelk_local_repo_path }}/certs/elkserver.key"
        dest: "{{ redelk_local_repo_path }}/certs/elkserver.key.pem"
        remote_src: true
        mode: preserve
      when: not redelk_elkserver_key_backup.stat.exists

    - name: Convert ELK private key to PKCS8 format
      community.crypto.openssl_privatekey:
        path: "{{ redelk_local_repo_path }}/certs/elkserver.key"
        type: RSA
        size: 2048
        format: pkcs8
        format_mismatch: convert
        mode: "0600"

    - name: Ensure package output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ redelk_local_repo_path }}/elkserver/mounts/logstash-config/certs_inputs"
        - "{{ redelk_local_repo_path }}/elkserver/initial-setup-data/certs"
        - "{{ redelk_local_repo_path }}/c2servers/filebeat"
        - "{{ redelk_local_repo_path }}/redirs/filebeat"
        - "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh"
        - "{{ redelk_local_repo_path }}/c2servers/ssh"
        - "{{ redelk_package_ssh_dir }}"

    - name: Find generated certificate files
      ansible.builtin.find:
        paths: "{{ redelk_local_repo_path }}/certs"
        recurse: false
        file_type: file
      register: redelk_package_cert_files

    - name: Copy certificates into ELK server input certificate directory
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ redelk_local_repo_path }}/elkserver/mounts/logstash-config/certs_inputs/{{ item.path | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ redelk_package_cert_files.files }}"

    - name: Copy certificates into ELK server initial setup directory
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ redelk_local_repo_path }}/elkserver/initial-setup-data/certs/{{ item.path | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ redelk_package_cert_files.files }}"

    - name: Copy RedELK CA certificate to client package directories
      ansible.builtin.copy:
        src: "{{ redelk_local_repo_path }}/certs/redelkCA.crt"
        dest: "{{ item }}"
        remote_src: true
        mode: preserve
      loop:
        - "{{ redelk_local_repo_path }}/c2servers/filebeat/redelkCA.crt"
        - "{{ redelk_local_repo_path }}/redirs/filebeat/redelkCA.crt"

    - name: Generate SSH key pair for RedELK sync user
      community.crypto.openssh_keypair:
        path: "{{ redelk_package_ssh_dir }}/id_rsa"
        type: rsa
        size: 2048
        state: present

    - name: Copy sync public key into C2 package
      ansible.builtin.copy:
        src: "{{ redelk_package_ssh_dir }}/id_rsa.pub"
        dest: "{{ redelk_local_repo_path }}/c2servers/ssh/id_rsa.pub"
        remote_src: true
        mode: preserve

    - name: Copy sync key pair into ELK server package
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: preserve
      loop:
        - src: "{{ redelk_package_ssh_dir }}/id_rsa"
          dest: "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh/id_rsa"
        - src: "{{ redelk_package_ssh_dir }}/id_rsa.pub"
          dest: "{{ redelk_local_repo_path }}/elkserver/mounts/redelk-ssh/id_rsa.pub"

    - name: Check if VERSION file exists
      ansible.builtin.stat:
        path: "{{ redelk_local_repo_path }}/VERSION"
      register: redelk_package_version_file

    - name: Copy VERSION file into package directories
      ansible.builtin.copy:
        src: "{{ redelk_local_repo_path }}/VERSION"
        dest: "{{ item }}"
        remote_src: true
        mode: preserve
      when: redelk_package_version_file.stat.exists
      loop:
        - "{{ redelk_local_repo_path }}/c2servers/VERSION"
        - "{{ redelk_local_repo_path }}/elkserver/VERSION"
        - "{{ redelk_local_repo_path }}/redirs/VERSION"

    - name: Create package archives
      community.general.archive:
        path: "{{ item.path }}"
        dest: "{{ item.dest }}"
        format: gz
        force_archive: true
      loop: "{{ redelk_package_archives }}"
