---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: dockerhost-01
    hostname: dockerhost-01
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - docker_hosts

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections:${HOME}/.ansible/collections
  config_options:
    defaults:
      host_key_checking: false
      become: false
  inventory:
    group_vars:
      docker_hosts:
        ansible_user: root
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
  playbooks:
    create: create.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  name: docker
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
