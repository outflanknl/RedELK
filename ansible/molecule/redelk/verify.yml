---
- name: Verify prepared RedELK packages
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    fixtures_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fixtures"
  tasks:
    - name: Check prepared package archives
      ansible.builtin.stat:
        path: "{{ fixtures_dir }}/{{ item }}"
      loop:
        - elkserver.tgz
        - c2servers.tgz
        - redirs.tgz
      register: redelk_package_archives

    - name: Read prepared ELK certificate
      community.crypto.x509_certificate_info:
        path: "{{ fixtures_dir }}/certs/elkserver.crt"
      register: redelk_package_certificate

    - name: Assert prepared packages contain configured certificate identities
      ansible.builtin.assert:
        that:
          - redelk_package_archives.results | map(attribute='stat.exists') | min
          - redelk_package_certificate.subject.commonName == 'elkserver-01'
          - "'DNS:elkserver-01' in redelk_package_certificate.subject_alt_name"
          - "'DNS:redelk.local' in redelk_package_certificate.subject_alt_name"
          - "'IP:127.0.0.1' in redelk_package_certificate.subject_alt_name"

- name: Verify ELK server
  hosts: elkservers
  gather_facts: false
  tasks:
    - name: Check ELK environment file
      ansible.builtin.stat:
        path: /opt/redelk/elkserver/.env
      register: elk_env_file

    - name: Read ELK self-signed certificate
      community.crypto.x509_certificate_info:
        path: /opt/redelk/elkserver/mounts/certbot/conf/live/noletsencrypt/fullchain.pem
      register: elk_self_signed_certificate

    - name: Assert ELK server artifacts and certificate identity
      ansible.builtin.assert:
        that:
          - elk_env_file.stat.exists
          - elk_self_signed_certificate.subject.commonName == 'elkserver-01'

- name: Verify connector locales
  hosts: c2servers:redirs
  gather_facts: false
  tasks:
    - name: List generated locales
      ansible.builtin.command: locale -a
      changed_when: false
      register: connector_locales

    - name: Read connector locale defaults
      ansible.builtin.slurp:
        src: /etc/default/locale
      register: connector_locale_defaults

    - name: Assert connector locale configuration
      ansible.builtin.assert:
        that:
          - "'en_us.utf8' in (connector_locales.stdout_lines | map('lower') | list)"
          - "'LANG=en_US.UTF-8' in (connector_locale_defaults.content | b64decode).splitlines()"
          - "'LC_ALL=en_US.UTF-8' in (connector_locale_defaults.content | b64decode).splitlines()"

- name: Verify C2 connector
  hosts: c2servers
  gather_facts: false
  tasks:
    - name: Check C2 Filebeat main config
      ansible.builtin.stat:
        path: /etc/filebeat/filebeat.yml
      register: c2_filebeat_config

    - name: Check C2 sync SSH authorized_keys
      ansible.builtin.stat:
        path: /home/scponly/.ssh/authorized_keys
      register: c2_sync_authorized_keys

    - name: Check C2 stage1 cron file
      ansible.builtin.stat:
        path: /etc/cron.d/redelk_sync_stage1_data
      register: c2_stage1_cron

    - name: Assert C2 artifacts exist
      ansible.builtin.assert:
        that:
          - c2_filebeat_config.stat.exists
          - c2_sync_authorized_keys.stat.exists
          - c2_stage1_cron.stat.exists

- name: Verify redirector connector
  hosts: redirs
  gather_facts: false
  tasks:
    - name: Check redirector Filebeat main config
      ansible.builtin.stat:
        path: /etc/filebeat/filebeat.yml
      register: redir_filebeat_config

    - name: Check redirector CA certificate
      ansible.builtin.stat:
        path: /etc/filebeat/redelkCA.crt
      register: redir_ca_cert

    - name: Assert redirector artifacts exist
      ansible.builtin.assert:
        that:
          - redir_filebeat_config.stat.exists
          - redir_ca_cert.stat.exists
