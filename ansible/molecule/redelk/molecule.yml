---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: elkserver-01
    hostname: elkserver-01
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    environment:
      container: docker
    groups:
      - elkservers

  - name: c2server-01
    hostname: c2server-01
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    environment:
      container: docker
    groups:
      - c2servers

  - name: redir-01
    hostname: redir-01
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    environment:
      container: docker
    groups:
      - redirs

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections:${HOME}/.ansible/collections
  config_options:
    defaults:
      host_key_checking: false
      become: false
      remote_tmp: /tmp/.ansible/tmp
  inventory:
    group_vars:
      all:
        redelk_local_repo_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fixtures"
        redelk_remote_base_path: /opt/redelk
      elkservers:
        ansible_user: root
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        redelk_elk_install_command: ./install-elkserver.sh limited
        redelk_start_containers: false
      c2servers:
        ansible_user: root
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        deploy_redelk: true
        redelk_attack_scenario: molecule-test
        redelk_logstash_endpoint: redelk.local:5044
      redirs:
        ansible_user: root
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        deploy_redelk: true
        redelk_attack_scenario: molecule-test
        redelk_logstash_endpoint: redelk.local:5044
  playbooks:
    create: create.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  name: redelk
  test_sequence:
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
