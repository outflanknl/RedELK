---
- name: Seed fixture workspace for the public RedELK workflow
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    repo_root: "{{ project_dir | dirname }}"
    fixtures_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fixtures"
  tasks:
    - name: Reset fixture directory
      ansible.builtin.file:
        path: "{{ fixtures_dir }}"
        state: absent

    - name: Create fixture certificate directory
      ansible.builtin.file:
        path: "{{ fixtures_dir }}/certs"
        state: directory
        mode: "0755"

    - name: Copy fixture sources from repository
      ansible.builtin.command:
        argv:
          - cp
          - -R
          - "{{ repo_root }}/{{ item }}"
          - "{{ fixtures_dir }}/{{ item }}"
      changed_when: true
      loop:
        - elkserver
        - c2servers
        - redirs
        - VERSION

    - name: Write fixture OpenSSL configuration
      ansible.builtin.copy:
        dest: "{{ fixtures_dir }}/certs/config.cnf"
        mode: "0644"
        content: |
          [req]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_req
          prompt = no

          [req_distinguished_name]
          C = NL
          ST = Utrecht
          L = Utrecht
          O = RedELK
          OU = Molecule
          CN = elkserver-01
          emailAddress = molecule@redelk.invalid

          [v3_ca]
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always,issuer:always
          basicConstraints = CA:TRUE

          [v3_req]
          keyUsage = nonRepudiation, digitalSignature, keyEncipherment, dataEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = elkserver-01
          DNS.2 = redelk.local
          IP.1 = 127.0.0.1
