---
- name: Running preflight checks
  hosts: elkservers:c2servers:redirs
  gather_facts: false
  tags:
    - pre
  pre_tasks:
    - name: Require one RedELK server per inventory  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - groups.get('elkservers', []) | length <= 1
        fail_msg: "Use one RedELK server per inventory; multi-ELK routing is not supported."
      run_once: true
      delegate_to: localhost
      become: false

    - name: Check known_hosts for selected hosts
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -F
          - "{{ ansible_host }}"
      delegate_to: localhost
      register: has_entry_in_known_hosts_file
      changed_when: false
      failed_when: false

    - name: Ignore host key on first run
      when: has_entry_in_known_hosts_file.rc == 1
      ansible.builtin.set_fact:
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: Delayed gathering of facts
      ansible.builtin.setup:

- name: Deploy RedELK server
  hosts: elkservers
  roles:
    - role: docker
      tags: redelk-server
    - role: redelk-server
      tags: redelk-server

- name: Deploy RedELK client on C2 servers
  hosts: c2servers
  roles:
    - role: redelk-client
      tags: redelk-client

- name: Deploy RedELK client on redirectors
  hosts: redirs
  roles:
    - role: redelk-client
      tags: redelk-client
