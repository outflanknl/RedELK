# Part of RedELK
#
# In this file we configure the logstash filters for Mythic - basic_logger container logs
#
# Author: hegusung
#
#

filter {
  if [infra][log][type] == "rtops" and [c2][program] == "mythic" {
    if [c2][log][type] == "events" {

      # {"level":"info","func":"MyContainer/my_logger.Initialize.func1","line":17,"data":{"operation_id":1,"operation_name":"Operation Chimera","username":"mythic_admin","timestamp":"2025-09-28T14:18:30.999833803Z","server_name":"mythic","action":"new_callback","data":{"id":50,"display_id":50,"agent_callback_id":"cdc16a0d-d1dd-4aa6-a017-8a8d219a9be5","init_callback":"2025-09-28T14:18:30.984822Z","last_checkin":"2025-09-28T14:18:30.984822Z","user":"user","host":"WINDOWS11","pid":8452,"ip":"[\"192.168.56.101\",\"127.0.0.1\"]","external_ip":"1.1.1.1","process_name":"\\\\VBoxSvr\\vbox_share\\xenon.exe","description":"Created by mythic_admin at 2025-09-26 21:50:28 Z","operator_id":1,"active":true,"registered_payload_id":195,"integrity_level":2,"locked":false,"locked_operator_id":null,"operation_id":1,"crypto_type":"aes256_hmac","dec_key":"rS5duhTPg+kxR4J/chdy97hjWdK8z8ugGuiOpru1stU=","enc_key":"rS5duhTPg+kxR4J/chdy97hjWdK8z8ugGuiOpru1stU=","os":"Windows","architecture":"x64","domain":"WORKGROUP","extra_info":"","sleep_info":"","timestamp":"2025-09-28T14:18:30.984822Z"}},"time":"2025-09-28T14:18:31Z","message":"new_callback"}
      # New implant
      if [message] == "new_callback" {
		
	    date { 
                match => ["[data][timestamp]", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"] 
		target => "@timestamp"
		timezone => "UTC"
              }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

	    mutate {
		replace  => { "[c2][log][type]" => "implant_newimplant" }

		rename  => { "[data][username]" => "[implant][operator]" }
		rename  => { "[data][data][id]" => "[implant][id]" }        
		rename  => { "[data][data][architecture]" => "[implant][arch]" }        
		rename  => { "[data][data][user]" => "[user][name]" }        
		rename  => { "[data][data][host]" => "[host][name]" }        
		rename  => { "[data][data][os]" => "[host][os][name]" }        
		rename  => { "[data][data][external_ip]" => "[host][ip_ext]" }        
		rename  => { "[data][data][pid]" => "[process][pid]" }        
		rename  => { "[data][data][process_name]" => "[process][name]" }        
	   }

	   if [data][data][domain] != "" {
	     mutate {
		replace => { "[user][name]" => "%{[data][data][domain]}\%{[user][name]}" }
	     }
           }

	   mutate {

		replace => { "[c2][message]" => "[%{[implant][id]}] New agent: %{[user][name]} %{[host][name]}" }

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }

              # add geo ip info from City DB
	    geoip {
		  source => "[host][ip_ext]"
		  target => "[host]"
		  add_tag => "geoip_host_city"
	    }
	    # add geo ip info from ASN DB
	    geoip {
		  source => "[host][ip_ext]"
		  target => "[host]"
		  default_database_type => "ASN"
		  add_tag => "geoip_host_asn"
	    }

	    clone {
		clones => [ "implantsdb" ]
          	remove_field => [ "[c2][log][type]","[c2][message]","[infra][log][type]" ]
	    }

      } else if [message] == "new_task" {
	#{"level":"info","func":"MyContainer/my_logger.Initialize.func2","line":20,"data":{"id":4,"agent_task_id":"50bcf003-9dc4-40c1-8e89-7645f93b440a","command_name":"status","params":"","timestamp":"2025-09-28 21:04:00.068423 +0000 +0000","callback_id":6,"status":"OPSEC Pre Check Running...","original_params":"","display_params":"","comment":"","stdout":"","stderr":"","completed":false,"operator_username":"mythic_admin","operator_id":1,"opsec_pre_blocked":false,"opsec_pre_message":"","opsec_pre_bypassed":false,"opsec_pre_bypass_role":"lead","opsec_post_blocked":false,"opsec_post_message":"","opsec_post_bypassed":false,"opsec_post_bypass_role":"lead","parent_task_id":0,"subtask_callback_function":"","subtask_callback_function_completed":false,"group_callback_function":"","group_callback_function_completed":false,"completed_callback_function":"","completed_callback_function_completed":false,"subtask_group_name":"","tasking_location":"parsed_cli","parameter_group_name":"Default","token_id":0,"is_interactive_task":false,"interactive_task_type":0},"time":"2025-09-28T21:04:00Z","message":"new_task"}
	#
      	    if [data][completed] {
		drop {}
	    }
	
	    date { 
                match => ["[data][timestamp]", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"] 
		target => "@timestamp"
		timezone => "UTC"
              }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

	    mutate {
		replace  => { "[c2][log][type]" => "implant_task" }

		rename  => { "[data][operator_username]" => "[implant][operator]" }
		rename  => { "[data][callback_id]" => "[implant][id]" }        
		rename  => { "[data][id]" => "[implant][task_id]" }        

		rename  => { "[data][command_name]" => "[implant][task]" }
		rename  => { "[data][params]" => "[implant][parameters]" }

		replace => { "[c2][message]" => "[%{[implant][task_id]}] New task: %{[implant][task]} %{[implant][parameters]} (agent: %{[implant][id]})" }

		remove_field => ["[host][name]"]   

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }

      } else if [message] == "new_response" {
	# {"level":"info","func":"MyContainer/my_logger.Initialize.func8","line":38,"data":{"id":4,"response":"PT09PT09PT0gQmVhY29uIGRlbGF5ID09PT09PT09PQpCZWFjb24gZGVmYXVsdCBkZWxheSA6IDEgc2Vjb25kcyArLy0gMCBzZWNvbmRzCj09PT09PT09IE1vZHVsZXMgPT09PT09PT09Cj09PT09PT09IEV4ZWN1dGlvbiBzdGFja3MgPT09PT09PT09CiAtICogZGVmYXVsdAogICBFbXB0eSBzdGFjaw==","task_id":4,"task_display_id":4,"timestamp":"2025-09-28T21:04:01.510101Z"},"time":"2025-09-28T21:04:01Z","message":"new_response"} 
	    date { 
                match => ["[data][timestamp]", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"] 
		target => "@timestamp"
		timezone => "UTC"
              }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

		ruby {
		  code => '
		    v = event.get("[data][response]")
		    if v.is_a?(String)
			require "base64"
			begin
			event.set("[implant][output]", Base64.strict_decode64(v))
			rescue ArgumentError
			event.set("[implant][output]", v)
			end
		    end
		  '
		}


	    mutate {
		replace  => { "[c2][log][type]" => "implant_output" }

		rename  => { "[data][id]" => "[implant][task_id]" }        

		replace => { "[c2][message]" => "[%{[implant][task_id]}] Task output:
%{[implant][output]}" }

		remove_field => ["[host][name]"]   

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }


      } else {
	drop {}
      }

    }
  }
}
