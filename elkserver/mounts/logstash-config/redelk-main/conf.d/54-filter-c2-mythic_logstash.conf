# Part of RedELK
#
# In this file we configure the logstash filters for Mythic - basic_logger container logs
#
# Author: hegusung
#
#

filter {
  if [infra][log][type] == "rtops" and [c2][program] == "mythic" {
    if [c2][log][type] == "events" {

      # New implant
      if [message] == "new_callback" {

	    mutate {
	    	remove_field => ["@timestamp"]   
	    }

	    date { 
                match  => [ "[data][timestamp]", "yyyy-MM-dd HH:mm:ss.SSSSSS Z Z", "yyyy-MM-dd HH:mm:ss.SSSSSS Z", "ISO8601" ]
		target => "@timestamp"
            }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

	    mutate {
		replace  => { "[c2][log][type]" => "implant_newimplant" }

		rename  => { "[data][username]" => "[implant][operator]" }
		rename  => { "[data][data][id]" => "[implant][id]" }        
		rename  => { "[data][data][architecture]" => "[implant][arch]" }        
		rename  => { "[data][data][user]" => "[user][name]" }        
		rename  => { "[data][data][host]" => "[host][name]" }        
		rename  => { "[data][data][os]" => "[host][os][name]" }        
		rename  => { "[data][data][pid]" => "[process][pid]" }        
		rename  => { "[data][data][process_name]" => "[process][name]" }        
	   }

	   if [data][data][external_ip] =~ ":" {
		mutate { split => { "[data][data][external_ip]" => ":" } }
		mutate {
		      	add_field => {
				"[host][ip_ext]" => "%{[data][data][external_ip][0]}"
		      	}
		}
	   } else {
	    	mutate {
			rename  => { "[data][data][external_ip]" => "[host][ip_ext]" }        
		}
	   }


	   if [data][data][domain] != "" {
	     mutate {
		replace => { "[user][name]" => "%{[data][data][domain]}\%{[user][name]}" }
	     }
           }

	   mutate {

		replace => { "[c2][message]" => "[%{[implant][id]}] New agent: %{[user][name]} %{[host][name]}" }

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }

              # add geo ip info from City DB
	    geoip {
		  source => "[host][ip_ext]"
		  target => "[host]"
		  add_tag => "geoip_host_city"
	    }
	    # add geo ip info from ASN DB
	    geoip {
		  source => "[host][ip_ext]"
		  target => "[host]"
		  default_database_type => "ASN"
		  add_tag => "geoip_host_asn"
	    }

	    clone {
		clones => [ "implantsdb" ]
          	remove_field => [ "[c2][log][type]","[c2][message]","[infra][log][type]" ]
	    }

      } else if [message] == "new_task" {
      	    if [data][completed] {
		drop {}
	    }
	
	    mutate {
	    	remove_field => ["@timestamp"]   
	    }

	    date { 
                match  => [ "[data][timestamp]", "yyyy-MM-dd HH:mm:ss.SSSSSS Z Z", "yyyy-MM-dd HH:mm:ss.SSSSSS Z", "ISO8601" ]
		target => "@timestamp"
            }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

	    mutate {
		replace  => { "[c2][log][type]" => "implant_task" }

		rename  => { "[data][operator_username]" => "[implant][operator]" }
		rename  => { "[data][callback_id]" => "[implant][id]" }        
		rename  => { "[data][id]" => "[implant][task_id]" }        

		rename  => { "[data][command_name]" => "[implant][task]" }
		rename  => { "[data][params]" => "[implant][parameters]" }

		replace => { "[c2][message]" => "[%{[implant][task_id]}] New task: %{[implant][task]} %{[implant][parameters]} (agent: %{[implant][id]})" }

		remove_field => ["[host][name]"]   

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }

      } else if [message] == "new_response" {

	    mutate {
	    	remove_field => ["@timestamp"]   
	    }

	    date { 
                match  => [ "[data][timestamp]", "yyyy-MM-dd HH:mm:ss.SSSSSS Z Z", "yyyy-MM-dd HH:mm:ss.SSSSSS Z", "ISO8601" ]
		target => "@timestamp"
            }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }

		ruby {
		  code => '
		    v = event.get("[data][response]")
		    if v.is_a?(String)
			require "base64"
			begin
			event.set("[implant][output]", Base64.strict_decode64(v))
			rescue ArgumentError
			event.set("[implant][output]", v)
			end
		    end
		  '
		}


	    mutate {
		replace  => { "[c2][log][type]" => "implant_output" }

		rename  => { "[data][id]" => "[implant][task_id]" }        

		replace => { "[c2][message]" => "[%{[implant][task_id]}] Task output:
%{[implant][output]}" }

		remove_field => ["[host][name]"]   

		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   
	    }


      } else if [message] == "new_credential" {

	    mutate {
	    	remove_field => ["@timestamp"]   
	    }

	    date { 
                match  => [ "[data][timestamp]", "yyyy-MM-dd HH:mm:ss.SSSSSS Z Z", "yyyy-MM-dd HH:mm:ss.SSSSSS Z", "ISO8601" ]
		target => "@timestamp"
            }

	    mutate {
		copy => { "@timestamp" => "[c2][timestamp]" }        
		remove_field => ["[data][timestamp]"]   
	    }
	
	    mutate {
		replace  => { "[c2][log][type]" => "credentials" }

		rename  => { "[data][realm]" => "[creds][realm]" }
		rename  => { "[data][account]" => "[creds][username]" }        
		rename  => { "[data][credential]" => "[creds][credential]" }        
		rename  => { "[data][task_id]" => "[creds][task_id]" }        
		#rename  => { "NOP" => "[creds][host]" }        
		#rename  => { "NOP" => "[creds][source]" }        
		
		replace => { "[c2][message]" => "[%{[creds][task_id]}] New credential: %{[creds][username]}@%{[creds][realm]}:%{[creds][credential]}" }
		
		remove_field => ["[level]"]   
		remove_field => ["[func]"]   
		remove_field => ["[line]"]   
		remove_field => ["[time]"]   
		remove_field => ["[message]"]   
		remove_field => ["[data]"]   

	   }


		
      } else {
	drop {}
      }

    }
  }
}
