name: Molecule

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/molecule.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/molecule.yml"

jobs:
  molecule:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: docker
            collections_file: molecule/docker/collections.yml
          # TODO: re-enable after fixing redelk tests
          # - scenario: redelk
          #   collections_file: molecule/redelk/collections.yml
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/.ansible/collections

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Molecule dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ansible-core==2.20.4" \
            "molecule==26.3.0" \
            "molecule-plugins[docker]==25.8.12" \
            "passlib"

      - name: Install Ansible collections for scenario
        working-directory: ansible
        run: |
          mkdir -p .ansible/collections
          ansible-galaxy collection install -r "${{ matrix.collections_file }}" -p .ansible/collections

      - name: Validate Ansible collection resolution
        working-directory: ansible
        run: |
          ansible-galaxy collection list community.docker
          ansible-galaxy collection list ansible.posix
          ansible-doc community.docker.docker_container > /dev/null

      - name: Run Molecule scenario
        working-directory: ansible
        run: molecule test -s "${{ matrix.scenario }}"
